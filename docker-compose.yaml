services:
  init:
    image: ${DOCKROOT_IMAGE:-ghcr.io/mannobeats/dockroot:latest}
    restart: "no"
    mem_limit: 256m
    cpus: 0.50
    environment:
      DOCKROOT_DATA_DIR: /var/lib/dockroot
    command:
      - node
      - /app/scripts/bootstrap-runtime.mjs
      - --write-postgres-password-file
      - /var/lib/dockroot/bootstrap/postgres_password
      - --write-metrics-token-file
      - /var/lib/dockroot/bootstrap/metrics_token
    volumes:
      - dockroot_data:/var/lib/dockroot
    networks:
      - backend

  app:
    image: ${DOCKROOT_IMAGE:-ghcr.io/mannobeats/dockroot:latest}
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.00
    environment:
      # Optional: set only if you want a fixed URL (e.g. behind a reverse proxy).
      # When omitted, Dockroot auto-detects the URL from incoming requests.
      APP_URL: ${APP_URL:-}
      # Optional: explicit auth origin allowlist (comma-separated), useful for
      # multi-origin access like domain + LAN IP.
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-}
      DOCKROOT_DATA_DIR: /var/lib/dockroot
      DOCKROOT_MANAGER_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-dockroot}
      DOCKROOT_RUNTIME_PROFILE: docker
      # Optional: override state signing secret for GitHub App onboarding.
      GITHUB_APP_STATE_SECRET: ${GITHUB_APP_STATE_SECRET:-}
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Dockroot}
      PORT: 3080
      POSTGRES_DB: dockroot
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: dockroot
      PROMETHEUS_URL: http://prometheus:9090
    ports:
      - "${DOCKROOT_PORT:-3080}:3080"
    depends_on:
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3080/api/health').then(r=>{if(!r.ok)throw 1})"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - dockroot_data:/var/lib/dockroot
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKROOT_DOCKER_SOCKET_GID:-998}"
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend
      - backend
      - monitoring

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.00
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: dockroot
      POSTGRES_USER: dockroot
      POSTGRES_PASSWORD_FILE: /var/lib/dockroot/bootstrap/postgres_password
    volumes:
      - dockroot_data:/var/lib/dockroot:ro
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dockroot -d dockroot"]
      interval: 5s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.50
    depends_on:
      init:
        condition: service_completed_successfully
    entrypoint:
      - /bin/sh
      - -eu
      - -c
      - |
        TOKEN_FILE="/var/lib/dockroot/bootstrap/metrics_token"
        TOKEN=""
        if [ -f "$$TOKEN_FILE" ]; then
          TOKEN="$$(tr -d '\r\n' < "$$TOKEN_FILE")"
        fi
        cat > /tmp/prometheus.yml <<EOF
        global:
          scrape_interval: 15s
          evaluation_interval: 15s

        scrape_configs:
          - job_name: prometheus
            static_configs:
              - targets: ["prometheus:9090"]

          - job_name: dockroot_app
            metrics_path: /api/metrics
        EOF
        if [ -n "$$TOKEN" ]; then
          cat >> /tmp/prometheus.yml <<EOF
            authorization:
              type: Bearer
              credentials: $$TOKEN
        EOF
        fi
        cat >> /tmp/prometheus.yml <<EOF
            static_configs:
              - targets: ["app:3080"]
                labels:
                  service: dockroot-manager

          - job_name: cadvisor
            static_configs:
              - targets: ["cadvisor:8080"]
                labels:
                  service: cadvisor

          - job_name: node_exporter
            static_configs:
              - targets: ["node-exporter:9100"]
                labels:
                  service: node-exporter
        EOF
        exec /bin/prometheus --config.file=/tmp/prometheus.yml --storage.tsdb.path=/prometheus --web.enable-lifecycle
    volumes:
      - dockroot_data:/var/lib/dockroot:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.50
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    security_opt:
      - no-new-privileges:true
    networks:
      - monitoring

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro
    security_opt:
      - no-new-privileges:true
    networks:
      - monitoring

volumes:
  dockroot_data:
  postgres_data:
  prometheus_data:

networks:
  frontend:
  backend:
  monitoring:
