services:
  app:
    image: ${DOCKROOT_IMAGE:-ghcr.io/mannobeats/dockroot:latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3080
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: dockroot
      POSTGRES_USER: dockroot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DOCKROOT_DATA_DIR: /var/lib/dockroot
      PROMETHEUS_URL: http://prometheus:9090
      DOCKROOT_MANAGER_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-dockroot}
      APP_METRICS_TARGET: app:3080
    ports:
      - "3080:3080"
    depends_on:
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_started
    volumes:
      - dockroot_data:/var/lib/dockroot
      - /var/run/docker.sock:/var/run/docker.sock

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dockroot
      POSTGRES_USER: dockroot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dockroot -d dockroot"]
      interval: 5s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    environment:
      APP_METRICS_TARGET: app:3080
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN}
    entrypoint:
      - /bin/sh
      - /etc/dockroot/prometheus/start-prometheus.sh
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/start-prometheus.sh:/etc/dockroot/prometheus/start-prometheus.sh:ro
      - prometheus_data:/prometheus

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    ports:
      - "9100:9100"
    volumes:
      - /:/host:ro

volumes:
  dockroot_data:
  postgres_data:
  prometheus_data:
