services:
  init:
    image: ${DOCKROOT_IMAGE:-ghcr.io/mannobeats/dockroot:latest}
    restart: "no"
    mem_limit: 256m
    cpus: 0.50
    environment:
      DOCKROOT_DATA_DIR: /var/lib/dockroot
    command:
      - node
      - /app/scripts/bootstrap-runtime.mjs
      - --write-postgres-password-file
      - /var/lib/dockroot/bootstrap/postgres_password
    volumes:
      - dockroot_data:/var/lib/dockroot
    networks:
      - backend

  app:
    image: ${DOCKROOT_IMAGE:-ghcr.io/mannobeats/dockroot:latest}
    user: "${DOCKROOT_CONTAINER_USER:-0:0}"
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.00
    environment:
      # Optional: set only if you want a fixed URL (e.g. behind a reverse proxy).
      # When omitted, Dockroot auto-detects the URL from incoming requests.
      APP_URL: ${APP_URL:-}
      # Optional: explicit auth origin allowlist (comma-separated), useful for
      # multi-origin access like domain + LAN IP.
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-}
      DOCKROOT_DATA_DIR: /var/lib/dockroot
      DOCKROOT_MANAGER_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-dockroot}
      DOCKROOT_RUNTIME_PROFILE: docker
      # Optional: override state signing secret for GitHub App onboarding.
      GITHUB_APP_STATE_SECRET: ${GITHUB_APP_STATE_SECRET:-}
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Dockroot}
      PORT: 3080
      POSTGRES_DB: dockroot
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: dockroot
    ports:
      - "${DOCKROOT_PORT:-3080}:3080"
    depends_on:
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3080/api/health').then(r=>{if(!r.ok)throw 1})"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - dockroot_data:/var/lib/dockroot
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKROOT_DOCKER_SOCKET_GID:-998}"
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend
      - backend

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.00
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: dockroot
      POSTGRES_USER: dockroot
      POSTGRES_PASSWORD_FILE: /var/lib/dockroot/bootstrap/postgres_password
    volumes:
      - dockroot_data:/var/lib/dockroot:ro
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dockroot -d dockroot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dockroot_data:
  postgres_data:

networks:
  frontend:
  backend:
