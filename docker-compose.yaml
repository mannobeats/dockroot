services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dockroot-app
    restart: unless-stopped
    ports:
      - "3080:3080"
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/dockroot
      DOCKROOT_DATA_DIR: ${PWD}/.dockroot
      PROMETHEUS_URL: http://prometheus:9090
    depends_on:
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_started
    volumes:
      - ./.dockroot:${PWD}/.dockroot
      - /Users/mannobeats/Documents/Software Development:/Users/mannobeats/Documents/Software Development:ro
      - /var/run/docker.sock:/var/run/docker.sock

  postgres:
    image: postgres:17-alpine
    container_name: dockroot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: dockroot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: dockroot-prometheus
    restart: unless-stopped
    env_file:
      - .env.local
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        cat >/tmp/prometheus.yml <<EOF
        global:
          scrape_interval: 15s
          evaluation_interval: 15s

        scrape_configs:
          - job_name: prometheus
            static_configs:
              - targets: ["prometheus:9090"]

          - job_name: dockroot_app
            metrics_path: /api/metrics
            authorization:
              type: Bearer
              credentials: $${METRICS_BEARER_TOKEN}
            static_configs:
              - targets: ["app:3080"]
                labels:
                  service: dockroot-manager

          - job_name: dockroot_host_dev
            metrics_path: /api/metrics
            authorization:
              type: Bearer
              credentials: $${METRICS_BEARER_TOKEN}
            static_configs:
              - targets: ["host.docker.internal:3080"]
                labels:
                  service: dockroot-host-dev

          - job_name: cadvisor
            static_configs:
              - targets: ["cadvisor:8080"]
                labels:
                  service: cadvisor

          - job_name: node_exporter
            static_configs:
              - targets: ["node-exporter:9100"]
                labels:
                  service: node-exporter
        EOF

        exec /bin/prometheus \
          --config.file=/tmp/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --web.enable-lifecycle
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: dockroot-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    ports:
      - "8081:8080"

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: dockroot-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro
    ports:
      - "9100:9100"

volumes:
  postgres_data:
  prometheus_data:
