services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dockroot}
      POSTGRES_USER: ${POSTGRES_USER:-dockroot}
      POSTGRES_PASSWORD_FILE: /var/lib/dockroot/bootstrap/postgres_password
    ports:
      - "5432:5432"
    volumes:
      - ${DOCKROOT_DATA_DIR:-.dockroot}:/var/lib/dockroot:ro
      - dockroot_dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dockroot} -d ${POSTGRES_DB:-dockroot}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  dockroot_dev_postgres_data:
